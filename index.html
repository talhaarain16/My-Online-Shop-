!DOCTYPE html>
<html>
<head>
    <title>My Online Shop</title>
    <style>
        body { font-family: Arial; text-align: center; }
        .product { border: 1px solid #ccc; padding: 10px; margin: 10px; display: inline-block; }
        button { background: green; color: white; padding: 5px 10px; border: none; }
    </style>
</head>
<body>

<h1>🛒 My Online Shop</h1>

<div class="product">
    <h3>Shirt</h3>
    <p>Price: Rs. 1500</p>
    <button onclick="addToCart('Shirt')">Add to Cart</button>
</div>

<div class="product">
    <h3>Shoes</h3>
    <p>Price: Rs. 3000</p>
    <button onclick="addToCart('Shoes')">Add to Cart</button>
</div>

<h2>🧺 Cart:</h2>
<ul id="cart"></ul>

<script>
    function addToCart(item) {
        let cart = document.getElementById("cart");
        let li = document.createElement("li");
        li.textContent = item;
        cart.appendChild(li);
    }
</script>

</body>
</html>
