<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Online Shop</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.container {
  max-width: 1000px;
  margin: 30px auto;
  padding: 15px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.product {
  background: white;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.product .icon {
  font-size: 60px;
}

.product h2 {
  margin: 10px 0;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin: 15px;
}

button {
  background: #16a34a;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #15803d;
}

.cart {
  background: white;
  margin-top: 30px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.cart h2 {
  margin-top: 0;
}

#cart {
  padding-left: 20px;
}

footer {
  text-align: center;
  padding: 25px;
  margin-top: 40px;
  background: #111827;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>🛒 My Online Shop</h1>
  <p>Quality Products at Great Prices</p>
</header>

<div class="container">

  <h2>Our Products</h2>

  <div class="products">

    <div class="product">
      <div class="icon">👕</div>
      <h2>Shirt</h2>
      <p>Premium Quality Shirt</p>
      <div class="price">Rs. 1500</div>
      <button onclick="addToCart('Shirt - Rs. 1500')">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <div class="icon">👟</div>
      <h2>Shoes</h2>
      <p>Comfortable Shoes</p>
      <div class="price">Rs. 3000</div>
      <button onclick="addToCart('Shoes - Rs. 3000')">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <div class="icon">☀️</div>
      <h2>Solar Panel</h2>
      <p>High Quality Solar Panel</p>
      <div class="price">Rs. 25000</div>
      <button onclick="addToCart('Solar Panel - Rs. 25000')">
        Add to Cart
      </button>
    </div>

  </div>

  <div class="cart">
    <h2>🛒 Your Cart</h2>
    <ul id="cart"></ul>
  </div>

</div>

<footer>
  <p>© 2026 My Online Shop</p>
</footer>

<script>
function addToCart(item) {
  let cart = document.getElementById("cart");
  let li = document.createElement("li");

  li.textContent = item;
  cart.appendChild(li);

  alert("Product added to cart!");
}
</script>

</body>
</html>
